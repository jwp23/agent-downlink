name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout=3m

  tests:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install rclone (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Unpack outside the checkout: anything in the checkout is treated as project source.
          cd "$RUNNER_TEMP"
          version=$(curl -fsS --proto '=https' --tlsv1.2 https://downloads.rclone.org/version.txt | awk '{print $2}')
          zip="rclone-${version}-linux-amd64.zip"
          curl -fsSO --proto '=https' --tlsv1.2 "https://downloads.rclone.org/${version}/${zip}"
          curl -fsSO --proto '=https' --tlsv1.2 "https://downloads.rclone.org/${version}/SHA256SUMS"
          sha256sum --ignore-missing -c SHA256SUMS
          unzip -q "$zip"
          sudo install -m 755 "rclone-${version}-linux-amd64/rclone" /usr/local/bin/rclone

      - name: Install rclone (macOS)
        if: runner.os == 'macOS'
        run: brew install rclone

      - name: Test
        run: go test ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
