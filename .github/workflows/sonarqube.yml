name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  sonarqube:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install rclone (Linux)
        run: |
          set -euo pipefail
          # Unpack outside the checkout: anything in the checkout is treated as project source.
          cd "$RUNNER_TEMP"
          version=$(curl -fsS --proto '=https' --tlsv1.2 https://downloads.rclone.org/version.txt | awk '{print $2}')
          zip="rclone-${version}-linux-amd64.zip"
          curl -fsSO --proto '=https' --tlsv1.2 "https://downloads.rclone.org/${version}/${zip}"
          curl -fsSO --proto '=https' --tlsv1.2 "https://downloads.rclone.org/${version}/SHA256SUMS"
          sha256sum --ignore-missing -c SHA256SUMS
          unzip -q "$zip"
          sudo install -m 755 "rclone-${version}-linux-amd64/rclone" /usr/local/bin/rclone

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  audit:
    name: SonarCloud drift audit
    needs: sonarqube
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run drift audit
        run: tools/sonar-audit.sh --branch main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
